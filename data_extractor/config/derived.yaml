# Derived (technical-indicator) fields. Computed AFTER the raw values are written, from Oracle history.
# sources: role -> raw column_id from attributes.yaml. lookback_rows: trading-day rows of history per stock.
# Blank (NULL) is written whenever a value cannot be computed (not enough history, missing input, ...).

# --- Trend

- column_id: sma_20
  derive_fn: derivers.indicators.sma
  sources: {close: close_price}
  params: {window: 20}
  lookback_rows: 20
  oracle_table: STOCK_DATA
  oracle_column: SMA_20

